function trPlan(p){const L=leadParts(p),tr=Math.round(L.tr),cu=Math.round(L.cu);let ready=p.ready||null,est=false;
 if(!ready){const st=startOf(p);if(st){ready=add(st,Math.round(L.prod*7));est=true}else return {ready:null,seg:[],th:null,est:false}}
 let e=add(ready,tr);e=addWork(e,cu);for(const q of L.sups)if(q.lead>0)e=addWork(e,q.lead);const th={a:ready,b:e};if(p.delivered&&p.delivered>th.b)th.b=p.delivered;/* theorie loopt door t/m afgifte op eindlocatie */
 const seg=[],cust=p.customs||null,sd=[];
 const sups=L.sups.map((q,i)=>({q,i})).filter(({q})=>q.in||q.out);
 sups.forEach(({q})=>{if(q.in)sd.push(q.in);if(q.out)sd.push(q.out)});
 const hasMid=!!cust||sd.length>0;
 let trEnd=cust?(cu>0?subWork(cust,cu):cust):(sd.length?sd.slice().sort()[0]:(p.delivered&&!hasMid?p.delivered:add(ready,tr)));
 if(trEnd<ready)trEnd=ready;
 const dnT=!!(p.customsDone||p.deliveredDone||sups.some(({q})=>q.inDone));
 if(trEnd>ready)seg.push({k:'tr',a:ready,b:trEnd,t:'Transport'+(p.transporteur?' ('+p.transporteur+')':''),c:'var(--pur)',dn:dnT});
 if(cust&&cu>0)seg.push({k:'cu',a:trEnd,b:cust,t:'Inklaring'+(p.inklaringDoor?' ('+p.inklaringDoor+')':''),c:'var(--org)',dn:!!p.customsDone});
 let last=cust||trEnd;
 for(const {q,i} of sups){const a=q.in||q.out;let b=q.out||(q.lead>0?addWork(q.in,q.lead):q.in);if(b<a)b=a;
  seg.push({k:'s'+i,a,b,t:q.n||('Leverancier '+(i+1)),c:'var(--pink)',dn:!!q.outDone});if(b>last)last=b}
 if(p.delivered&&p.delivered>last&&hasMid)seg.push({k:'eind',a:last,b:p.delivered,t:'Naar eindbestemming'+(p.land?' ('+p.land+')':''),c:'var(--teal)',dn:!!p.deliveredDone});
 return {ready,est,seg,th}}
function trEnd(p){const P=trPlan(p);if(!P.ready)return null;return p.delivered||P.seg.reduce((m,x)=>x.b>m?x.b:m,P.ready)}
const trDur=p=>{const P=trPlan(p),e=trEnd(p);return P.ready&&e?diff(e,P.ready):0};
const trTitle=p=>{const P=trPlan(p);if(!P.ready)return 'Nog geen datum voor gereed voor ophalen';const L=leadParts(p),sv=L.sups.reduce((a,q)=>a+q.lead,0);return 'Transport van '+fmt(P.ready)+(P.est?' (geschat)':'')+' t/m '+fmt(trEnd(p))+' = '+trDur(p)+' dagen. Theoretisch: transport '+fw(L.tr)+' d + inklaring '+fw(L.cu)+' werkdagen + leveranciers '+fw(sv)+' werkdagen'};
function trDates(p){const P=trPlan(p);return P.ready?[P.ready,P.th&&P.th.b,p.customs,p.delivered,...supDates(p),...P.seg.flatMap(x=>[x.a,x.b])]:[p.delivered]}

function setProj(id,v){const p=S.phases.find(x=>x.id===id),i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven); wijziging niet opgeslagen.');render();return}if(p.project===v)return;S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Project',o:p.project,n:v});p.project=v;save();render()}
function quickAdd(){const i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven).');return}const g=groupSort(S.phases),proj=pf||(g[0]&&g[0][0])||Object.keys(S.projects)[0];if(!proj){toast('Maak eerst een project aan bij Instellingen.');return}
 const p={id:'f'+Date.now(),project:proj,fase:'nieuw',comments:[],_m:1};S.phases.push(p);S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:proj+' nieuw',f:'Fase',o:'–',n:'aangemaakt'});view='gantt';gsel=p.id;_foc='i_fase';_top=true;save();render()}
function dupPhase(id){const i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven).');return}const s0=S.phases.find(x=>x.id===id),p=JSON.parse(JSON.stringify(s0));p.id='f'+Date.now();p.fase=s0.fase+' (kopie)';p.comments=[];S.phases.push(p);S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Fase',o:'–',n:'aangemaakt (kopie)'});gsel=p.id;_foc='i_fase';_top=true;save();render()}
function delPhase(id){const i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven).');return}const p=S.phases.find(x=>x.id===id);askConfirm('Fase verwijderen?',`Weet je zeker dat je <b>${esc(p.project)} – fase ${esc(p.fase)}</b> wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`,'Verwijderen',()=>{S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Fase',o:'bestond',n:'verwijderd'});S.phases=S.phases.filter(x=>x.id!==id);(S.del=S.del||[]).push(id);gsel=null;save();render()})}
function addC2(id){const t=($('#ic').value||'').trim(),i=who();if(!t)return;if(!i){toast('Vul eerst je initialen in (rechtsboven); opmerking niet geplaatst.');return}const p=S.phases.find(x=>x.id===id);(p.comments=p.comments||[]).push({m:'',who:i,ts:nowS(),at:Date.now(),t});save();render()}
function delC2(id,j){const i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven).');return}const p=S.phases.find(x=>x.id===id),c=p.comments[j];if(!c)return;askConfirm('Opmerking verwijderen?',`“${esc(c.t.slice(0,120))}”`,'Verwijderen',()=>{(S.delc=S.delc||[]).push(ck(c));p.comments.splice(j,1);S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Opmerking ('+c.who+')',o:c.t.slice(0,60),n:'verwijderd'});save();render()})}

const ARRL={ready:['Transporteur geregeld','Transporteur nog te regelen'],customs:['Inklaring afgestemd met inklaarder','Inklaring nog af te stemmen met inklaarder'],delivered:['Levering afgestemd met eindklant','Levering nog af te stemmen met eindklant'],in:['Afgifte afgesproken met leverancier','Afgifte nog af te spreken'],out:['Ophaaldatum afgesproken met leverancier','Ophaaldatum nog af te spreken']};
const arrRow=(id,key,al,arr,done)=>done?'':`<div class="arr ${arr?'ok':'open'}"><label><input type="checkbox" ${arr?'checked':''} onchange="setArr('${id}','${key}',this.checked)"><span>${arr?'✔ '+al[0]:'○ '+al[1]}</span></label></div>`;
function actsOf(p){const out=[],add=(key,lab,date,done,arr,extra)=>out.push({key,lab,date:date||null,done:!!done,arr:!!arr,extra:extra||''});
 add('ready','Transporteur producent regelen',p.ready,p.readyDone,p.readyArr,p.transporteur);
 add('customs','Inklaring afstemmen met inklaarder',p.customs,p.customsDone,p.customsArr,p.inklaringDoor);
 for(let i=0;i<NS;i++){const s=effSup(p,i);if(!(s.n||s.lead||s.in||s.out))continue;const o=(p.sups||[])[i]||{},nm=s.n||'leverancier '+(i+1);add('s'+i+'in','Afgifte aan '+nm+' regelen',s.in,s.inDone,o.inArr,nm);add('s'+i+'out','Ophalen bij '+nm+' regelen',s.out,s.outDone,o.outArr,nm)}
 add('delivered','Levering bij eindklant afstemmen',p.delivered,p.deliveredDone,p.deliveredArr,[p.eind,p.land].filter(Boolean).join(', '));return out}
const openActs=p=>p.deliveredDone?[]:actsOf(p).filter(a=>!a.done&&!a.arr);
function setArr(id,key,v){const p=S.phases.find(x=>x.id===id),w=who();if(!w){toast('Vul eerst je initialen in (rechtsboven); wijziging niet opgeslagen.');render();return}
 const m=key.match(/^s(\d)(in|out)$/);let old;if(m){p.sups=p.sups||[];const o=(p.sups[+m[1]]=p.sups[+m[1]]||{});old=!!o[m[2]+'Arr'];o[m[2]+'Arr']=v}else{old=!!p[key+'Arr'];p[key+'Arr']=v}
 if(old===v)return;const lab=(actsOf(p).find(a=>a.key===key)||{}).lab||key;S.log.unshift({at:Date.now(),ts:nowS(),who:w,pf:p.project+' '+p.fase,f:'Geregeld: '+lab,o:old?'ja':'nee',n:v?'ja':'nee'});save();render()}

function actView(){const rows=[];visible().forEach(p=>{if(p.deliveredDone)return;actsOf(p).forEach(a=>{if(!a.done)rows.push({p,a})})});
 const open=rows.filter(x=>!x.a.arr),dd=a=>a.date?diff(a.date,TODAY):9999;
 const L=(af==='open'?open:af==='arr'?rows.filter(x=>x.a.arr):rows).sort((x,y)=>(x.a.date||'9999').localeCompare(y.a.date||'9999')||x.p.project.localeCompare(y.p.project));
 const late=open.filter(x=>x.a.date&&x.a.date<TODAY).length,soon=open.filter(x=>x.a.date&&dd(x.a)>=0&&dd(x.a)<=7).length;
 const chip=(k,l,n)=>`<button class="chip${af===k?' on':''}" onclick="af='${k}';render()"><b>${n}</b> ${l}</button>`;
 const dtcell=(p,a)=>{const m=a.key.match(/^s(\d)(in|out)$/),id='a_'+p.id+'_'+a.key;return m?dtc(id,a.date,`setSupD('${p.id}',${+m[1]},'${m[2]}',this)`):dtc(id,a.date,`setFD('${p.id}','${a.key}',this)`)};
 const term=(a)=>{if(!a.date)return '<span class="no">datum onbekend</span>';const d=dd(a);return d<0?`<span class="late">${-d} d over datum</span>`:d===0?'<span class="warn">vandaag</span>':d<=7?`<span class="warn">over ${d} d</span>`:`over ${d} d`};
 return filterBar()+`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">${chip('open','nog te regelen',open.length)}${chip('arr','geregeld',rows.length-open.length)}${chip('all','alles',rows.length)}<span class="perf"><b class="late">${late}</b> over datum · <b class="warn">${soon}</b> binnen 7 dagen</span></div>
 <table><tr><th>Geregeld</th><th>Project</th><th>Fase</th><th>Actie</th><th>Met</th><th>Datum</th><th>Termijn</th><th>Status</th><th></th></tr>${L.map(({p,a})=>`<tr><td><input type="checkbox" title="Geregeld met externe partij" ${a.arr?'checked':''} onchange="setArr('${p.id}','${a.key}',this.checked)"></td><td>${esc(p.project)}</td><td><b>${esc(p.fase)}</b> ${pill(p.status)}</td><td>${esc(a.lab)}</td><td>${esc(a.extra)}</td><td>${dtcell(p,a)}</td><td>${a.arr?'':term(a)}</td><td>${a.arr?'<span class="ok">✔ geregeld</span>':'<span class="warn">○ nog te regelen</span>'}</td><td><button class="btn" onclick="view='gantt';gsel='${p.id}';_top=true;render()">Open</button></td></tr>`).join('')||'<tr><td colspan="9" class="no">Geen actiepunten in deze selectie.</td></tr>'}</table></div>`}
const HELP="<div style=\"display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--sf);padding:8px 0;z-index:2;border-bottom:1px solid var(--ln)\"><h2 style=\"font-size:18px;margin:0\">ⓘ Uitleg en handleiding</h2><span class=\"sp\"></span><button class=\"btn\" onclick=\"$('#hlp').close()\">Sluiten</button></div>\n<details open><summary>1. Snel starten</summary><div class=\"hb\">\n<ul>\n<li><b>Initialen:</b> vul rechtsboven je initialen in. Zonder initialen kun je niets wijzigen. Elke wijziging komt met je initialen, datum en tijd in het <b>Log</b>.</li>\n<li><b>Gantt-chart (hoofdscherm):</b> klik op een rij of op een icoon. Rechts opent het zijpaneel met alle gegevens van die fase. Alles wat je daar wijzigt wordt <b>direct opgeslagen</b>; er is geen opslaan-knop. Klik je op een icoon in de chart, dan staat de cursor meteen in het bijbehorende datumveld.</li>\n<li><b>Nieuwe fase:</b> klik op <b>+ Fase</b>. Er verschijnt een lege fase in het gekozen project. Je geeft hem een naam en vult de datums in. <b>Kopiëren</b> en <b>Verwijderen</b> staan onderaan het zijpaneel.</li>\n<li><b>Filteren en zoeken:</b> kies bovenaan een project, klik op een teller (te laat, tekeningen te laat, op schema, geleverd, met open actiepunten) of zoek op fase, ordernummer, PO of transporteur.</li>\n<li><b>Bladeren:</b> met de pijltjestoetsen ↑ ↓ wissel je van fase, met Esc sluit je het zijpaneel.</li>\n<li><b>Zoom:</b> gebruik −, + en ⤢ (alles in beeld) of Ctrl + scrollen.</li>\n<li><b>Projecten:</b> klik op een projectnaam om het project in of uit te klappen. Met ⤒ ▲ ▼ wijzig je de volgorde (bijvoorbeeld de actuele projecten bovenaan). Met de knop \"Sorteer op leverdatum\" zet je de automatische volgorde terug.</li>\n<li><b>Tabbladen:</b> <b>Gantt</b>, <b>Actiepunten</b>, <b>Tabel</b> (alles in kolommen, direct te wijzigen), <b>Log</b> (alle wijzigingen) en <b>Instellingen</b>.</li>\n<li><b>Excel:</b> met ⇩ Excel exporteer je alle fases (handig als back-up), met ⇪ Excel importeer je een bestand met dezelfde kolomkoppen. Lege cellen overschrijven niets.</li>\n<li><b>Kleuren:</b> kies Licht, Donker of Automatisch.</li>\n</ul></div></details>\n<details><summary>2. Mijlpalen, verwacht en gerealiseerd</summary><div class=\"hb\">\n<p>Elke fase doorloopt deze mijlpalen, elk met een datum:</p>\n<table class=\"ht\"><tr><th>Icoon</th><th>Mijlpaal</th><th>Opmerking</th></tr>\n<tr><td>📐</td><td>Tekeningen ontvangen</td><td>Bepaalt het begin van de doorlooptijd.</td></tr>\n<tr><td>🧾</td><td>Inkooporder ontvangen</td><td>Optioneel. Telt alleen mee als je hem invult.</td></tr>\n<tr><td>⚙️</td><td>Start productie</td><td></td></tr>\n<tr><td>📦</td><td>Gereed voor ophalen producent</td><td>Met vinkje gerealiseerd en vinkje transporteur geregeld.</td></tr>\n<tr><td>🛃</td><td>Inklaring</td><td>Met vinkje gerealiseerd en vinkje afgestemd met inklaarder.</td></tr>\n<tr><td>🏭 🚚</td><td>Tussenleverancier: afgifte en ophalen</td><td>Tot 5 leveranciers, elk met afgifte- en ophaaldatum.</td></tr>\n<tr><td>🏁</td><td>Geleverd op locatie</td><td>Met vinkje gerealiseerd en vinkje afgestemd met eindklant.</td></tr></table>\n<p><b>Verwacht of gerealiseerd:</b> een datum is voorlopig (verwacht) totdat je het vinkje <b>gerealiseerd</b> zet. In de chart heeft een verwachte mijlpaal een gestippelde rand. Een gerealiseerde mijlpaal heeft een groene rand met een vinkje.</p>\n<p><b>Status van de fase</b> volgt de laatst bereikte stap:</p>\n<ol><li><b>Gepland</b>, zolang de tekeningen er niet zijn.</li><li><b>Tekeningen ontvangen</b>, zodra de datum van de tekeningen is bereikt.</li><li><b>Productie</b>, zodra de startdatum is bereikt.</li><li><b>Op transport</b>, als gereed voor ophalen gerealiseerd is.</li><li><b>Ingeklaard</b>, als de inklaring gerealiseerd is. Dit blijft zo tot de volgende stap gerealiseerd is.</li><li><b>Bij tussenleverancier</b>, als de afgifte aan een leverancier gerealiseerd is.</li><li><b>Onderweg naar eindbestemming</b>, als het ophalen bij de leverancier gerealiseerd is.</li><li><b>Geleverd</b>, als geleverd op locatie gerealiseerd is.</li></ol>\n<p>Tekeningen en start productie tellen dus op datum. De overige stappen tellen pas als je het vinkje hebt gezet.</p></div></details>\n<details><summary>3. Hoe de doorlooptijd wordt berekend</summary><div class=\"hb\">\n<p><b>Berekende doorlooptijd tot levering klant</b> = <b>producent</b> + <b>tussenleveranciers</b> + <b>transport</b> + <b>inklaring</b>.</p>\n<table class=\"ht\"><tr><th>Onderdeel</th><th>Eenheid</th><th>Hoe geteld</th></tr>\n<tr><td>Producent</td><td>weken</td><td>1 week = 7 kalenderdagen.</td></tr>\n<tr><td>Tussenleverancier (elk)</td><td>werkdagen</td><td>Maandag tot en met vrijdag. Weekenden tellen niet mee.</td></tr>\n<tr><td>Transport</td><td>dagen</td><td>Kalenderdagen, dus inclusief weekenden.</td></tr>\n<tr><td>Inklaring</td><td>werkdagen</td><td>Maandag tot en met vrijdag.</td></tr></table>\n<ul><li>Een <b>leeg veld of 0 telt niet mee</b>. Een tussenleverancier telt alleen mee als zijn doorlooptijd groter is dan 0.</li>\n<li>Je stelt de <b>standaard per project</b> in bij Instellingen. Daar geldt hij voor alle fases van dat project.</li>\n<li>Per fase kun je dit <b>overschrijven</b> in het zijpaneel onder Doorlooptijden en bij de leveranciers. Laat je een veld leeg, dan geldt de projectstandaard. Vul je 0 in, dan telt dat onderdeel voor die fase niet mee.</li>\n<li>Bij de standaard van een project staat \"ca.\": omdat er dan nog geen datum is, rekent de tool 5 werkdagen als 7 dagen. Bij een fase met een datum rekent hij exact met de kalender.</li></ul>\n<p><b>Voorbeeld:</b> gevraagde leverdatum vrijdag 16 oktober, met 9 weken producent, 3 werkdagen leverancier, 2 dagen transport en 2 werkdagen inklaring. Terugrekenen: 2 werkdagen inklaring geeft woensdag 14 oktober, 2 dagen transport geeft maandag 12 oktober, 3 werkdagen leverancier geeft woensdag 7 oktober, en 9 weken eerder is woensdag 5 augustus. De berekende doorlooptijd is dus <b>72 dagen</b>.</p></div></details>\n<details><summary>4. Uiterste aanlevering, reële einddatum en afwijking</summary><div class=\"hb\">\n<ul>\n<li><b>Uiterste aanlevering tekening/inkooporder</b> = gevraagde leverdatum min de berekende doorlooptijd. Daar komen de vakantiedagen van de producent bij die in die periode vallen.</li>\n<li><b>Reële einddatum</b> = de datum waarop de levering gehaald wordt vanaf het moment dat tekeningen en inkooporder binnen zijn: start + berekende doorlooptijd, plus vakantie. De <b>start</b> is de laatst ontvangen van tekeningen en inkooporder. Is er geen inkooporder ingevuld, dan telt alleen de datum van de tekeningen. Zonder tekeningen is er geen reële einddatum.</li>\n<li><b>Afwijking (rood):</b> reële einddatum min gevraagde leverdatum. Bij geleverde fases is dat de werkelijke leverdatum min de gevraagde datum.</li>\n<li><b>Tekeningen te laat (oranje):</b> het aantal dagen tussen de uiterste aanlevering en de datum waarop tekeningen/inkooporder binnenkwamen. Zijn ze nog niet binnen, dan telt het aantal dagen tot vandaag.</li>\n<li><b>Eerder klaar dan gevraagd (groen):</b> ligt de reële einddatum vóór de gevraagde leverdatum, dan zie je dat als groen stuk in de chart.</li>\n<li><b>Vakantie producent:</b> stel de periodes in bij Instellingen. Met het vinkje \"verlengt doorlooptijd\" schuift elke vakantiedag in de periode de datums op (alle kalenderdagen tellen). Zonder vinkje wordt de periode alleen getoond.</li>\n<li><b>Tellers:</b> <i>te laat</i> = reële einddatum na de gevraagde datum, <i>tekeningen te laat</i> = niet te laat, maar tekeningen/inkooporder te laat, <i>op schema</i> = geen van beide, <i>geleverd</i> = afgerond. Het uitroepteken in de rij wordt oranje bij een lichte en rood bij een kritieke afwijking. De drempels stel je in bij Instellingen.</li>\n<li><b>Leverprestatie</b> (bovenaan) telt alleen gerealiseerde leveringen: binnen de gevraagde datum, later maar binnen de gestelde doorlooptijd, en later én buiten de gestelde doorlooptijd.</li></ul></div></details>\n<details><summary>5. De Gantt-chart lezen</summary><div class=\"hb\">\n<table class=\"ht\"><tr><th>Weergave</th><th>Betekenis</th></tr>\n<tr><td>Gearceerde balk</td><td>Theoretische doorlooptijd: van uiterste aanlevering tot de gevraagde leverdatum.</td></tr>\n<tr><td>Grijze balk</td><td>Reële doorlooptijd, vanaf de start (tekeningen en inkooporder binnen).</td></tr>\n<tr><td>Rood stuk</td><td>Het deel na de gevraagde leverdatum: te laat.</td></tr>\n<tr><td>Oranje balk</td><td>Tekeningen of inkooporder te laat.</td></tr>\n<tr><td>Groen stuk</td><td>Eerder klaar dan gevraagd.</td></tr>\n<tr><td>Paarse streep</td><td>Gevraagde leverdatum door klant.</td></tr>\n<tr><td>Oranje streep</td><td>Vandaag.</td></tr>\n<tr><td>Oranje vlak</td><td>Vakantie producent. Grijs betekent: geen invloed op de doorlooptijd.</td></tr>\n<tr><td>🚩</td><td>Uiterste aanlevering tekening/inkooporder.</td></tr>\n<tr><td>Oranje uitroepteken bij een icoon</td><td>Nog te regelen met een externe partij.</td></tr>\n<tr><td>Gestippelde rand / groene rand met ✔</td><td>Verwacht / gerealiseerd.</td></tr></table>\n<p>Een kleur voor de status staat links in de rij als stipje. Een knop <b>Legenda</b> bovenaan toont alle iconen.</p></div></details>\n<details><summary>6. Actiepunten en afspraken met externen</summary><div class=\"hb\">\n<p>In het zijpaneel staat onder bepaalde mijlpalen een regel met een vinkje voor de afspraak met een externe partij:</p>\n<ul><li><b>Gereed voor ophalen:</b> transporteur geregeld.</li><li><b>Inklaring:</b> afgestemd met de inklaarder.</li><li><b>Tussenleverancier:</b> afgifte afgesproken en ophaaldatum afgesproken.</li><li><b>Geleverd op locatie:</b> afgestemd met de eindklant.</li></ul>\n<p>Oranje betekent: nog te regelen. Groen met ✔: geregeld. Zodra een stap gerealiseerd is, verdwijnt de regel.</p>\n<p>Het tabblad <b>Actiepunten</b> toont al deze stappen in één lijst, gesorteerd op datum. Je ziet per regel het project, de fase, de actie, met wie (transporteur, inklaarder, leverancier of eindklant), de datum en de termijn: <i>over datum</i> in rood, <i>binnen 7 dagen</i> in oranje. Met het vinkje maak je een punt direct geregeld, de datum kun je in de lijst wijzigen en met <b>Open</b> spring je naar de fase. Fases die al geleverd zijn staan er niet in.</p></div></details>\n<details><summary>7. Goed om te weten</summary><div class=\"hb\">\n<ul><li>Iedereen werkt in dezelfde gegevens. Wijzigt iemand anders iets, dan ververst je scherm vanzelf.</li>\n<li>Wijzigen twee mensen tegelijk <b>hetzelfde veld</b> van dezelfde fase, dan wint de laatste opslag. Opmerkingen en log blijven altijd behouden.</li>\n<li>Verwijderen van een fase, project of opmerking kan niet ongedaan worden gemaakt. Er verschijnt eerst een bevestiging. Maak regelmatig een Excel-export als back-up.</li>\n<li>Het <b>Log</b> toont alle wijzigingen aan gewichten, datums, doorlooptijden, vinkjes, fases en projecten.</li>\n<li>De kolommen in de Tabel en de lijst met Actiepunten zijn direct te wijzigen, net als het zijpaneel.</li></ul></div></details>\n";

const TABN=['Data en logistiek','Leveranciers en doorlooptijd','Gewicht, orders en planning','Opmerkingen'];
const TG=[['Tekeningen en inkooporder','Levering','Producent','Inklaring en transport','Eindbestemming'],[],['Gewicht','Orders','Planning']];
const tabBar=()=>`<div class="tabs">${TABN.map((t,i)=>`<button type="button" class="tb${i===dtab?' on':''}" onclick="showTab(${i})">${t}</button>`).join('')}</div>`;
const tpane=(i,h)=>`<div class="tp" style="display:${i===dtab?'block':'none'}">${h}</div>`;
function showTab(i){dtab=i;document.querySelectorAll('#dlg .tb').forEach((b,j)=>b.classList.toggle('on',j===i));document.querySelectorAll('#dlg .tp').forEach((q,j)=>q.style.display=j===i?'block':'none')}
const grpHtml=(n,fn)=>`<div class="gg">${GR.filter(g=>TG[n].includes(g[0])).map(fn).join('')}</div>`;
const cmHtml=(p,del)=>(p.comments||[]).map((c,j)=>`<div class="cm">${del?`<button class="btn" style="float:right;padding:0 8px" title="Opmerking verwijderen" onclick="delC(${j})">✕</button>`:''}<small>${esc(c.who)} · ${esc(c.ts)}${c.m&&MSN[c.m]?' · '+MSN[c.m]:''}</small><br>${esc(c.t)}</div>`).join('')||'<div class="no" style="margin:6px 0">Nog geen opmerkingen.</div>';
function supDetail(p){const L=leadParts(p),own=k=>p[k]!=null&&p[k]!==''?' <span class="no">(eigen)</span>':' <span class="no">(project)</span>',st=(d,dn)=>d?fmt(d)+(dn?' <span class="ok">✔ gerealiseerd</span>':' <span class="no">(verwacht)</span>'):'–';
 const rows=L.sups.map((s,i)=>(s.n||s.lead||s.in||s.out)?`<tr><td>${esc(s.n||'Leverancier '+(i+1))}</td><td>${s.lead?fw(s.lead)+' werkdagen':'–'}</td><td>${st(s.in,s.inDone)}</td><td>${st(s.out,s.outDone)}</td></tr>`:'').join('');
 return `<div class="supb"><table class="stt"><tr><th></th><th>Doorlooptijd</th><th>Afgifte aan leverancier</th><th>Ophalen bij leverancier</th></tr><tr><td>Producent</td><td>${fw(L.prod)} wk${own('prodLead')}</td><td></td><td></td></tr>${rows||'<tr><td colspan="4" class="no">Geen tussenleveranciers ingevuld.</td></tr>'}<tr><td>Transport</td><td>${L.tr?fw(L.tr)+' dagen':'–'}${own('trLead')}</td><td></td><td></td></tr><tr><td>Inklaring</td><td>${L.cu?fw(L.cu)+' werkdagen':'–'}${own('cuLead')}</td><td></td><td></td></tr></table><div style="margin-top:8px">Berekende doorlooptijd tot levering klant: ${twHtml(p)}</div></div>`}
function supForm(p){const t=tplOf(p),o=i=>(p.sups||[])[i]||{},tp=i=>(t.sups||[])[i]||{},ph=(v,u)=>v!=null&&v!==''?fw(+v)+' '+u:u;
 const lr=(lab,id,v,pv,st,u)=>`<tr><td>${lab}</td><td colspan="1"><input id="f_${id}" type="number" step="${st||1}" min="0" style="width:125px" placeholder="${ph(pv,u)}" value="${esc(v??'')}"></td><td></td><td></td></tr>`;
 const rows=Array.from({length:NS},(_,i)=>`<tr><td>Leverancier ${i+1}</td><td><input id="f_s${i}n" style="width:130px" placeholder="${esc(tp(i).n||'naam')}" value="${esc(o(i).n||'')}"> <input id="f_s${i}lead" type="number" step="1" min="0" style="width:115px" placeholder="${ph(tp(i).lead,'werkdagen')}" value="${esc(o(i).lead??'')}"></td><td>${dtc('f_s'+i+'in',o(i).in)}<label class="ck"><input type="checkbox" id="f_s${i}inDone" ${o(i).inDone?'checked':''}> gerealiseerd</label></td><td>${dtc('f_s'+i+'out',o(i).out)}<label class="ck"><input type="checkbox" id="f_s${i}outDone" ${o(i).outDone?'checked':''}> gerealiseerd</label></td></tr>`).join('');
 return `<div class="supb"><div class="no" style="margin-bottom:6px">Leeg laten = projectstandaard (grijs getoond). Eenheden: producent in weken, tussenleveranciers en inklaring in werkdagen (ma–vr), transport in dagen. Vul 0 in om een onderdeel voor deze fase niet mee te tellen. Een leverancier telt alleen mee als de doorlooptijd groter is dan 0.</div><table class="stt"><tr><th></th><th>Naam en doorlooptijd (werkdagen)</th><th>Afgifte aan leverancier</th><th>Ophalen bij leverancier</th></tr>${lr('Producent (weken)','prodLead',p.prodLead,t.prod??9,0.5,'wk')}${rows}${lr('Transport (dagen)','trLead',p.trLead,t.tr,1,'dagen')}${lr('Inklaring (werkdagen)','cuLead',p.cuLead,t.cu,1,'werkdagen')}</table><div style="margin-top:8px">Berekend bij opslaan: ${twHtml(p)}</div></div>`}
function openDet(id,keep){if(!keep)dtab=0;sel=id;window._dc=0;window._dcj=-1;const p=S.phases.find(x=>x.id===id),r=calc(p);
 const val=k=>{const t=KT(k);return t==='date'?fmt(p[k])+(TRK.includes(k)&&p[k]?(p[k+'Done']?' <span class="ok">✔ gerealiseerd</span>':' <span class="no">(verwacht)</span>'):''):k==='kg'||k==='kgOg'?kgf(p[k]):esc(p[k])};
 const fn=g=>GB(g[0],g[1].map(k=>k[0]==='@'?fv(CL[k],CV(k,p,r)):fv(FL[k],val(k))));
 $('#dlg').innerHTML=`<h2 style="font-size:16px">${esc(p.project)} – fase ${esc(p.fase)} ${pill(p.status)}</h2><div class="fg" style="margin-bottom:10px">${fv('Project',esc(p.project))}${fv('Fase',esc(p.fase))}</div>
 ${tabBar()}${tpane(0,grpHtml(0,fn))}${tpane(1,supDetail(p))}${tpane(2,grpHtml(2,fn))}${tpane(3,`${cmHtml(p,1)}<div style="display:flex;gap:6px;margin-top:6px"><textarea id="c_all" rows="3" placeholder="Opmerking" style="flex:1"></textarea><button class="btn" onclick="addC('all')">Plaats</button></div>`)}
 <div style="margin-top:10px"><label class="no">Initialen <input id="d_who" size="4" maxlength="4" value="${esc(who())}" style="text-transform:uppercase"></label> <span id="err" class="late"></span></div>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="btn p" onclick="openForm('${id}')">Wijzigen</button><button class="btn" onclick="openForm('${id}',1)">Kopiëren</button><button class="btn" onclick="delP('${id}')">Verwijderen</button><span class="sp"></span><button class="btn" onclick="$('#dlg').close()">Sluiten</button></div>`;
 if(!$('#dlg').open)$('#dlg').showModal()}
function addC(k){const i=getWho('#d_who'),t=$('#c_'+k).value.trim();if(!i){$('#err').textContent='Vul je initialen in.';return}if(!t)return;
 const p=S.phases.find(x=>x.id===sel);(p.comments=p.comments||[]).push({m:'',who:i,ts:nowS(),at:Date.now(),t});save();openDet(sel,1)}
function delC(j){const i=getWho('#d_who');if(!i){$('#err').textContent='Vul je initialen in.';return}if(window._dcj!==j){window._dcj=j;$('#err').textContent='Klik nogmaals op ✕ om deze opmerking te verwijderen.';return}window._dcj=-1;const p=S.phases.find(x=>x.id===sel),c=p.comments[j];if(!c)return;(S.delc=S.delc||[]).push(ck(c));p.comments.splice(j,1);S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Opmerking ('+(c.m?c.m+', ':'')+c.who+')',o:c.t.slice(0,60),n:'verwijderd'});save();openDet(sel,1)}
function askConfirm(title,text,yes,fn){$('#cfm').innerHTML=`<h2 style="font-size:16px">${title}</h2><p>${text}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$('#cfm').close()">Annuleren</button><button class="btn p" id="cfy" style="background:var(--red);border-color:var(--red)">${yes}</button></div>`;$('#cfy').onclick=()=>{$('#cfm').close();fn()};$('#cfm').showModal()}
function delP(id){const i=getWho('#d_who');if(!i){$('#err').textContent='Vul je initialen in.';return}const p=S.phases.find(x=>x.id===id);
 askConfirm('Fase verwijderen?',`Weet je zeker dat je <b>${esc(p.project)} – fase ${esc(p.fase)}</b> wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`,'Verwijderen',()=>{S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:p.project+' '+p.fase,f:'Fase',o:'bestond',n:'verwijderd'});S.phases=S.phases.filter(x=>x.id!==id);(S.del=S.del||[]).push(id);save();$('#dlg').close();render()})}
function addProj(){const n=$('#np_n').value.trim(),w=Math.max(1,Math.min(52,+$('#np_w').value||9));if(!n){toast('Vul een projectnaam in.');return}if(Object.keys(S.projects).some(x=>x.toLowerCase()===n.toLowerCase())){toast('Dit project bestaat al.');return}S.delp=(S.delp||[]).filter(x=>x!==n);S.projects[n]=newProj(w);S.log.unshift({at:Date.now(),ts:nowS(),who:who()||'?',pf:n,f:'Project',o:'–',n:'aangemaakt'});save();render();toast('Project "'+n+'" toegevoegd.')}
function delProj(n){const i=who();if(!i){toast('Vul eerst je initialen in (rechtsboven).');return}const q=S.phases.filter(p=>p.project===n);
 askConfirm('Project verwijderen?',`Weet je zeker dat je project <b>${esc(n)}</b> wilt verwijderen, inclusief ${q.length} fase(s) en alle opmerkingen daarbij? Dit kan niet ongedaan worden gemaakt.`,'Project verwijderen',()=>{S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:n,f:'Project',o:'bestond ('+q.length+' fases)',n:'verwijderd'});q.forEach(p=>(S.del=S.del||[]).push(p.id));S.phases=S.phases.filter(p=>p.project!==n);delete S.projects[n];(S.delp=S.delp||[]).push(n);if(pf===n)pf='';save();render()})}
function openForm(id,cp){if(!id&&!cp)dtab=0;const src=id?S.phases.find(x=>x.id===id):null;if(cp)id='';const p=cp?{...src,fase:src.fase+' (kopie)',comments:[]}:src||{project:pf||'',fase:''},r=calc(p);
 const inp=k=>{const t=KT(k);return `<label>${FL[k]}${t==='date'?dtc('f_'+k,p[k]):`<input id="f_${k}" type="${t==='number'?'number':'text'}" ${t==='number'?'step="any"':''} value="${esc(p[k]??'')}">`}</label>${TRK.includes(k)?`<div class="no"><label style="flex-direction:row;display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" id="f_${k}Done" ${p[k+'Done']?'checked':''}> Gerealiseerd (anders verwacht)</label></div>`:''}`};
 const fn=g=>GB(g[0],g[1].map(k=>k[0]==='@'?`<div class="no">${CL[k]}: <span style="color:var(--tx)">${CV(k,p,r)}</span></div>`:inp(k)));
 $('#dlg').innerHTML=`<h2 style="font-size:16px">${id?'Fase wijzigen':cp?'Fase kopiëren':'Nieuw project of nieuwe fase'}</h2><div class="fg" style="margin-bottom:10px">
 <label>Project<input id="f_project" list="pl" value="${esc(p.project)}"><datalist id="pl">${Object.keys(S.projects).map(n=>`<option>${esc(n)}`).join('')}</datalist></label><label>Fase<input id="f_fase" value="${esc(p.fase)}"></label></div>
 ${tabBar()}${tpane(0,grpHtml(0,fn))}${tpane(1,supForm(p))}${tpane(2,grpHtml(2,fn))}${tpane(3,`${cmHtml(p,0)}<label class="no" style="display:block;margin-top:6px">Nieuwe opmerking (wordt bij opslaan geplaatst)<textarea id="f_newc" rows="3" style="width:100%"></textarea></label>${id?'<div class="no">Opmerkingen verwijderen kan in de detailweergave.</div>':''}`)}
 <p class="no">Berekende velden worden automatisch bijgewerkt. De reële doorlooptijd start bij de laatst ontvangen van tekeningen en inkooporder. Wijzigingen aan gewichten, doorlooptijden en datums komen met je initialen en tijdstip in het log.</p>
 <label class="no">Initialen (verplicht) <input id="f_who" size="4" maxlength="4" value="${esc(who())}" style="text-transform:uppercase"></label> <span id="err" class="late"></span>
 <div style="display:flex;gap:8px;margin-top:10px"><button class="btn p" onclick="saveForm('${id||''}')">Opslaan</button><span class="sp"></span><button class="btn" onclick="$('#dlg').close()">Annuleren</button></div>`;
 if(!$('#dlg').open)$('#dlg').showModal()}
function saveForm(id){const i=getWho('#f_who');if(!i){$('#err').textContent='Vul je initialen in.';return}
 const g=k=>$('#f_'+k).value.trim(),proj=g('project'),fase=g('fase');if(!proj||!fase){$('#err').textContent='Project en fase zijn verplicht.';return}
 let p=id?S.phases.find(x=>x.id===id):{id:'f'+Date.now(),comments:[],_m:1};const nw={project:proj,fase};
 for(const gr of GR)for(const k of gr[1]){if(k[0]==='@')continue;const t=KT(k),v=g(k);if(t==='date'&&v!==''&&!pd(v)){$('#err').textContent='Ongeldige datum bij "'+FL[k]+'": gebruik dd-mm-jjjj.';return}nw[k]=t==='text'?v:(v===''?null:t==='number'?+v:t==='date'?pd(v):v)}
 nw.prodLead=nz(g('prodLead'));nw.trLead=nz(g('trLead'));nw.cuLead=nz(g('cuLead'));
 const sups=[];for(let n=0;n<NS;n++){const a=g('s'+n+'in'),b=g('s'+n+'out');if((a&&!pd(a))||(b&&!pd(b))){$('#err').textContent='Ongeldige datum bij tussenleverancier '+(n+1)+': gebruik dd-mm-jjjj.';return}sups.push({n:g('s'+n+'n'),lead:nz(g('s'+n+'lead')),in:a?pd(a):null,inDone:$('#f_s'+n+'inDone').checked,out:b?pd(b):null,outDone:$('#f_s'+n+'outDone').checked})}
 nw.sups=sups;const RAW=['kg','kgOg','prodLead','trLead','cuLead'];
 if(id){for(const k of LOGK){if((p[k]??null)!==nw[k])S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:proj+' '+fase,f:LBL[k],o:RAW.includes(k)?(p[k]??'standaard'):fmt(p[k]),n:RAW.includes(k)?(nw[k]??'standaard'):fmt(nw[k])})}
  for(let n=0;n<NS;n++){const o=(p.sups||[])[n]||{},q=sups[n];for(const f of ['lead','in','out','inDone','outDone']){const ov=f.endsWith('Done')?!!o[f]:(o[f]??null),qv=q[f];if(ov!==qv)S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:proj+' '+fase,f:'Tussenleverancier '+(n+1)+' ('+(q.n||o.n||'')+') – '+SUPL[f],o:fmtSup(f,o[f]),n:fmtSup(f,qv)})}}}
 else S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:proj+' '+fase,f:'Fase',o:'–',n:'aangemaakt'});
 for(const k of TRK)nw[k+'Done']=$('#f_'+k+'Done').checked;if(id)for(const k of TRK){if(!!p[k+'Done']!==nw[k+'Done'])S.log.unshift({at:Date.now(),ts:nowS(),who:i,pf:proj+' '+fase,f:LBL[k]+' – gerealiseerd',o:p[k+'Done']?'ja':'nee',n:nw[k+'Done']?'ja':'nee'})}
 const nc=($('#f_newc')?.value||'').trim();Object.assign(p,nw);if(nc)(p.comments=p.comments||[]).push({m:'',who:i,ts:nowS(),at:Date.now(),t:nc});if(!id)S.phases.push(p);
 S.delp=(S.delp||[]).filter(x=>x!==proj);if(!S.projects[proj])S.projects[proj]=newProj(9);save();$('#dlg').close();render()}
init();
</script></body></html>
